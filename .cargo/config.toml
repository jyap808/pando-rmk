[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
# `scripts/flash.sh` objcopies the ELF to a raw binary and flashes it with
# dfu-util. dfu-util must not be handed the ELF: it would treat it as a raw
# image.
runner = "./scripts/flash.sh"
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=--nmagic"]

[env]
KEYBOARD_TOML_PATH = { value = "keyboard.toml", relative = true }
