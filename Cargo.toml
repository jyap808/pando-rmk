[package]
name = "pando-rmk"
version = "1.0.0"
edition = "2024"
authors = ["Julian Yap (@jyap808)"]
description = "RMK firmware for the Pando split keyboard"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "pando-rmk"
path = "src/main.rs"
test = false
bench = false

[features]
default = []

[dependencies]
rmk = { version = "0.9.0", default-features = false, features = [
    "vial",
    "storage",
    "host_lock",
] }

embassy-stm32 = { version = "0.6.0", features = [
    "stm32g0b1kb",
    "time-driver-any",
    "unstable-pac",
] }
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }

cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
# Cortex-M0+ has no atomic CAS; static_cell/portable-atomic need this.
portable-atomic = { version = "1", features = ["critical-section"] }

panic-halt = "1.0"

[profile.dev]
codegen-units = 1
debug = true
opt-level = "s"
overflow-checks = true
lto = "fat"
panic = "abort"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
panic = "abort"

